[project]
name = "boswell-server"
version = "0.2.0"
description = "Home processing server for Boswell Phone"
requires-python = "==3.13.*"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.118",
    "uvicorn>=0.37",
    "numpy>=2.2",
    "av>=15.0",
    "onnxruntime-gpu>=1.23",
    "pyannote-audio==4.0.7",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "textual>=6.0",
    "qrcode>=8.0",
    "nvidia-ml-py>=13.0",
    "httpx>=0.28",
    "soundfile>=0.14.0",
    "sherpa-onnx",
    "nemo-toolkit[asr]>=2.5",
]

[project.scripts]
boswell-server = "boswell_server.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# A Linux computer with an NVIDIA GPU: the CUDA builds below are Linux-only.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
sherpa-onnx = { url = "https://huggingface.co/csukuangfj2/sherpa-onnx-wheels/resolve/main/cuda/1.13.8/sherpa_onnx-1.13.8+cuda12.cudnn9.onnxruntime1.28.2-cp313-cp313-linux_x86_64.whl" }
